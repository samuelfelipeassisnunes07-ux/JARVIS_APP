<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis AI - Assistente Inteligente</title>
  <meta name="description" content="Assistente pessoal inteligente com aprendizado contínuo">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">🤖</div>
          <div class="logo-text">
            <h1>Jarvis AI</h1>
            <span class="subtitle">Assistente Inteligente</span>
          </div>
        </div>
        <div class="header-actions">
          <div class="status-indicator">
            <div class="status-dot" id="connectionStatus"></div>
            <span class="status-text" id="connectionText">Conectando...</span>
          </div>
          <button class="header-btn" id="settingsBtn" title="Configurações">
            <span class="btn-icon">⚙️</span>
          </button>
        </div>
      </div>
    </header>

    <main id="chat" class="chat-container" aria-label="Histórico da conversa" role="log" aria-live="polite">
      <!-- Mensagens serão inseridas aqui -->
    </main>

    <!-- Modal de Feedback -->
    <div id="feedbackModal" class="modal" role="dialog" aria-labelledby="feedbackTitle" aria-modal="true">
      <div class="modal-overlay" tabindex="-1">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="feedbackTitle" class="modal-title">📝 Avalie a resposta</h2>
            <button class="close-modal" aria-label="Fechar modal" tabindex="0">
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="rating-section">
              <p class="rating-label">Como você avalia esta resposta?</p>
              <div class="rating-stars" role="radiogroup" aria-label="Avaliação de 1 a 5 estrelas">
                <button class="star" data-rating="1" aria-label="1 estrela - Muito ruim" tabindex="0">
                  <span class="star-icon">⭐</span>
                  <span class="star-label">1</span>
                </button>
                <button class="star" data-rating="2" aria-label="2 estrelas - Ruim" tabindex="0">
                  <span class="star-icon">⭐</span>
                  <span class="star-label">2</span>
                </button>
                <button class="star" data-rating="3" aria-label="3 estrelas - Regular" tabindex="0">
                  <span class="star-icon">⭐</span>
                  <span class="star-label">3</span>
                </button>
                <button class="star" data-rating="4" aria-label="4 estrelas - Boa" tabindex="0">
                  <span class="star-icon">⭐</span>
                  <span class="star-label">4</span>
                </button>
                <button class="star" data-rating="5" aria-label="5 estrelas - Excelente" tabindex="0">
                  <span class="star-icon">⭐</span>
                  <span class="star-label">5</span>
                </button>
              </div>
            </div>
            <div class="feedback-section">
              <label for="feedbackText" class="feedback-label">Comentário opcional</label>
              <textarea
                id="feedbackText"
                class="feedback-textarea"
                placeholder="Conte-nos o que achou da resposta..."
                rows="4"
                maxlength="500"
                aria-describedby="charCount"
              ></textarea>
              <div class="char-count">
                <span id="charCount">0/500</span>
              </div>
            </div>
            <div class="modal-actions">
              <button class="btn-secondary" id="cancelFeedback" tabindex="0">
                <span class="btn-text">Cancelar</span>
              </button>
              <button class="btn-primary" id="submitFeedback" disabled tabindex="0">
                <span class="btn-text">Enviar Feedback</span>
                <span class="btn-icon">📤</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de Configurações -->
    <div id="settingsModal" class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
      <div class="modal-overlay" tabindex="-1">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="settingsTitle" class="modal-title">⚙️ Configurações</h2>
            <button class="close-modal" aria-label="Fechar configurações" tabindex="0">
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="settings-section">
              <h3 class="section-title">🎨 Aparência</h3>
              <div class="setting-item">
                <label class="setting-label">Tema</label>
                <select class="setting-select" id="themeSelect">
                  <option value="dark">Escuro</option>
                  <option value="light">Claro</option>
                </select>
              </div>
            </div>

            <div class="settings-section">
              <h3 class="section-title">📊 Estatísticas</h3>
              <div class="stats-grid">
                <div class="stat-item">
                  <span class="stat-value" id="totalMessages">0</span>
                  <span class="stat-label">Mensagens</span>
                </div>
                <div class="stat-item">
                  <span class="stat-value" id="sessionTime">00:00</span>
                  <span class="stat-label">Tempo</span>
                </div>
                <div class="stat-item">
                  <span class="stat-value" id="feedbackCount">0</span>
                  <span class="stat-label">Feedbacks</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <form id="messageForm" class="input-form" role="form" aria-label="Enviar mensagem">
        <div class="input-group">
          <textarea
            id="message-input"
            class="message-input"
            placeholder="Digite sua mensagem para o Jarvis..."
            autocomplete="off"
            aria-label="Digite sua mensagem"
            maxlength="1000"
            spellcheck="true"
            rows="1"
          ></textarea>
        </div>
        <div class="input-actions">
          <button type="button" class="btn btn-secondary" id="voiceBtn" title="Comando de voz">
            <i class="fas fa-microphone"></i>
            <span class="btn-text">Voz</span>
          </button>
          <button type="submit" class="btn btn-primary" id="sendButton" disabled>
            <i class="fas fa-paper-plane"></i>
            <span class="btn-text">Enviar</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notifications -->
  <div class="toast-container" id="toastContainer" aria-live="assertive" aria-atomic="true"></div>

  <!-- Modals -->
  <div class="modal" id="settings-modal" aria-hidden="true" role="dialog" aria-labelledby="settings-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settings-title" class="modal-title">Configurações</h2>
        <button class="modal-close" aria-label="Fechar configurações">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="api-url" class="form-label">URL da API:</label>
          <input type="url" id="api-url" class="form-input" value="http://127.0.0.1:8000" placeholder="http://127.0.0.1:8000">
        </div>
        <div class="form-group">
          <label for="theme-select" class="form-label">Tema:</label>
          <select id="theme-select" class="form-select">
            <option value="dark">Escuro</option>
            <option value="light">Claro</option>
            <option value="auto">Automático</option>
          </select>
        </div>
        <div class="form-group">
          <label for="voice-enabled" class="form-label">
            <input type="checkbox" id="voice-enabled"> Habilitar voz
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="jarvisInterface.hideAllModals()">Cancelar</button>
        <button class="btn btn-primary" onclick="jarvisInterface.saveSettings()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal" id="stats-modal" aria-hidden="true" role="dialog" aria-labelledby="stats-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="stats-title" class="modal-title">Estatísticas do Jarvis</h2>
        <button class="modal-close" aria-label="Fechar estatísticas">&times;</button>
      </div>
      <div class="modal-body">
        <div id="stats-container">
          <div class="loading">Carregando estatísticas...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="jarvisInterface.hideAllModals()">Fechar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
